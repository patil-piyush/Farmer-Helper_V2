groups:
  - name: sli_recording_rules
    interval: 30s
    rules:
      # Availability: 1 - (5xx requests / total requests).
      # or vector(0) handles the case where no 5xx series exists.
      # Return no SLI when there is no request traffic.
      - record: sli:availability:rate5m
        expr: |
          (
            1 -
            (
              (
                sum(rate(http_requests_total{job="backend", status_code=~"5.."}[5m]))
                or vector(0)
              )
              /
              sum(rate(http_requests_total{job="backend"}[5m]))
            )
          )
          and
          (sum(rate(http_requests_total{job="backend"}[5m])) > 0)

      - record: sli:availability:rate30m
        expr: |
          (
            1 -
            (
              (
                sum(rate(http_requests_total{job="backend", status_code=~"5.."}[30m]))
                or vector(0)
              )
              /
              sum(rate(http_requests_total{job="backend"}[30m]))
            )
          )
          and
          (sum(rate(http_requests_total{job="backend"}[30m])) > 0)

      # Latency: fraction of requests completed within 500 ms.
      - record: sli:latency:rate5m
        expr: |
          (
            sum(rate(http_request_duration_seconds_bucket{job="backend", le="0.5"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="backend"}[5m]))
          )
          and
          (sum(rate(http_request_duration_seconds_count{job="backend"}[5m])) > 0)

      - record: sli:latency:rate30m
        expr: |
          (
            sum(rate(http_request_duration_seconds_bucket{job="backend", le="0.5"}[30m]))
            /
            sum(rate(http_request_duration_seconds_count{job="backend"}[30m]))
          )
          and
          (sum(rate(http_request_duration_seconds_count{job="backend"}[30m])) > 0)

      # Error budget remaining: 1 - (error ratio / allowed error ratio).
      # Availability SLO = 99%; latency SLO = 95%.
      - record: sli:error_budget:availability
        expr: |
          1 - ((1 - sli:availability:rate30m) / (1 - 0.99))

      - record: sli:error_budget:latency
        expr: |
          1 - ((1 - sli:latency:rate30m) / (1 - 0.95))
