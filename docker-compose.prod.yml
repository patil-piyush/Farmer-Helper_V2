services:

  backend:
    image: ${DOCKERHUB_USER}/farmer-backend:${IMAGE_TAG:-latest}
    container_name: farmer_backend
    ports:
      - "5000:5000"
    env_file:
    - ./backend/.env
    depends_on:
      - ml_service
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USER}/farmer-frontend:${IMAGE_TAG:-latest}
    container_name: farmer_frontend
    ports:
      - "5173:5173"
    env_file:
    - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  ml_service:
    image: ${DOCKERHUB_USER}/farmer-ml:${IMAGE_TAG:-latest}
    container_name: farmer_ml_service
    ports:
      - "5001:5001"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: eu-north-1
    restart: unless-stopped
