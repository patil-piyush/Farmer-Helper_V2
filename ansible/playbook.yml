---
- name: Configure EC2 and deploy Farmer Helper
  hosts: web
  become: true
  vars_files:
    - secrets.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine + Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Clone/update the app repo
      git:
        repo: "https://github.com/patil-piyush/Farmer-Helper_V2.git"
        dest: /home/ubuntu/app
        version: devops
        force: true

    - name: Template backend .env
      template:
        src: templates/backend.env.j2
        dest: /home/ubuntu/app/backend/.env
        mode: "0600"

    - name: Template frontend .env
      template:
        src: templates/frontend.env.j2
        dest: /home/ubuntu/app/frontend/.env
        mode: "0600"

    - name: Template root .env (for docker-compose variable substitution)
      template:
        src: templates/root.env.j2
        dest: /home/ubuntu/app/.env
        mode: "0600"

    - name: Bring the app up with Docker Compose
      command: docker compose up -d --build
      args:
        chdir: /home/ubuntu/app
