# -----------------------------------------------------------
# ConfigMap — non-secret configuration shared across pods
# -----------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: farmer-helper-config
  namespace: farmer-helper
data:
  # Backend
  PORT: "5000"
  ML_SERVICE_URL: "http://ml-service:5001"

  # ML Service
  AWS_REGION: "eu-north-1"

  # Frontend (Vite reads VITE_* vars at dev-server startup)
  VITE_API_URL: "http://localhost:5000"
